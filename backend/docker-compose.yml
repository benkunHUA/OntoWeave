services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ontoweave
      POSTGRES_PASSWORD: ontoweave
      POSTGRES_DB: ontoweave
    ports:
      - "5432:5432"
    volumes:
      - ontoweave_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoweave"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ontoweave_db:
