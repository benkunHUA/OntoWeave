services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ontoweave}:${POSTGRES_PASSWORD:-ontoweave}@host.docker.internal:15432/${POSTGRES_DB:-ontoweave}?options=-csearch_path%3Dapp%2Cpublic"
      DATA_SERVICE_URL: http://host.docker.internal:18001
      DATA_SERVICE_TOKEN: dev-internal-token
      RABBITMQ_URL: amqp://ontoweave:ontoweave@host.docker.internal:5673/%2F
      EVENT_CONSUMER_ENABLED: "true"
    ports:
      # 宿主机 8000 可能被别的项目占用，这里映射到 18000。
      - "127.0.0.1:18000:8000"
