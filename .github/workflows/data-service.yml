name: data-service

on:
  push:
    paths:
      - "data-service/**"
      - ".github/workflows/data-service.yml"
  pull_request:
    paths:
      - "data-service/**"
      - ".github/workflows/data-service.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: data-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: ./mvnw -B verify
