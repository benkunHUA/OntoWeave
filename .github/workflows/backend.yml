name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ontoweave
          POSTGRES_PASSWORD: ontoweave
          POSTGRES_DB: ontoweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontoweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ontoweave:ontoweave@localhost:5432/ontoweave_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create test database
        env:
          PGPASSWORD: ontoweave
        run: psql -h localhost -U ontoweave -d postgres -c "CREATE DATABASE ontoweave_test OWNER ontoweave;"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Tests
        run: pytest -v
