name: backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ontoweave
          POSTGRES_PASSWORD: ontoweave
          POSTGRES_DB: ontoweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ontoweave"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://ontoweave:ontoweave@localhost:5432/ontoweave_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Create test database
        env:
          PGPASSWORD: ontoweave
        run: psql -h localhost -U ontoweave -d postgres -c "CREATE DATABASE ontoweave_test OWNER ontoweave;"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -v
